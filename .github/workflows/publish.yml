name: Publish

# Publishes when package.json version is new on npm after a push to main.
#
# Backfill: the update workflow jumps straight to the newest simple-icons release, so versions
# released in between (or while the workflow was broken) never reach npm. The backfill job publishes
# every skipped upstream version from the first one this package published up to main, oldest first,
# with the "backfill" dist-tag so "latest" never moves backwards. It runs after every publish and can
# be started by hand (Actions → Publish → Run workflow), optionally from an earlier version.
#
# Security (see TanStack May 2026 supply-chain postmortem):
# - Only push / workflow_dispatch — never pull_request or pull_request_target
# - github.repository guard so fork workflows cannot publish
# - No actions/cache (no shared cache with untrusted PR jobs)
# - Minimal permissions; checkout without persisting credentials
# - npm environment must match the Trusted Publisher environment name on npm
# - Publishes via npm Trusted Publisher (OIDC); no NPM_TOKEN secret

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill from this simple-icons version (e.g. 16.0.0). Empty: first version on npm."
        required: false
        default: ""

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check-version:
    name: Check npm version
    if: github.repository == 'ThinkHumanDotDev/react-native-simple-icons'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.npm.outputs.publish }}
      backfill: ${{ steps.backfill.outputs.versions }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compare package.json version to registry
        id: npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not on npm; will validate and publish."
          fi

      - name: List skipped simple-icons versions
        id: backfill
        env:
          BACKFILL_FROM: ${{ inputs.backfill_from }}
        # A failed lookup must not block the regular publish; the next run picks the gap up.
        run: |
          if ! VERSIONS=$(bun scripts/plan-backfill.ts --from "${BACKFILL_FROM}"); then
            echo "::warning::Could not list skipped versions; no backfill this run."
            VERSIONS="[]"
          fi
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Versions to backfill: ${VERSIONS}"

  publish:
    name: Publish to npm
    needs: check-version
    if: >-
      github.repository == 'ThinkHumanDotDev/react-native-simple-icons' &&
      needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10.x).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun run generate:icons
      - run: git diff --exit-code
      - run: bun run typecheck
      - run: bun run build
      - run: bun run smoke:react-native
      - run: bun run test
      - run: npm pack --dry-run

      # Do not set NODE_AUTH_TOKEN — setup-node's registry-url .npmrc must
      # fall through to OIDC Trusted Publishing instead of a classic token.
      - name: Publish to npm
        run: |
          npm --version
          npm publish --provenance --access public --ignore-scripts

      - name: Generate release notes
        run: bun scripts/github-release-notes.ts /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

  backfill:
    name: Backfill v${{ matrix.version }}
    needs: [check-version, publish]
    # Runs after the regular publish (or when it was skipped) so "latest" is settled first.
    if: >-
      !cancelled() &&
      github.repository == 'ThinkHumanDotDev/react-native-simple-icons' &&
      needs.check-version.result == 'success' &&
      needs.publish.result != 'failure' &&
      needs.check-version.outputs.backfill != '[]'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    strategy:
      # Oldest first, one at a time: each release diffs against the tag of the one before it.
      max-parallel: 1
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.check-version.outputs.backfill) }}
    env:
      VERSION: ${{ matrix.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact "simple-icons@${VERSION}"
      - run: bun run generate:icons

      - name: Check package version
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "${ACTUAL}" != "${VERSION}" ]; then
            echo "::error::Generated package version ${ACTUAL}, expected ${VERSION}."
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run build
      - run: bun run smoke:react-native
      - run: bun run test
      - run: npm pack --dry-run

      # --tag backfill keeps "latest" on the newest release; npm would otherwise move it here.
      - name: Publish to npm
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts --tag backfill

      # The tag points at a commit off main holding the generated sources for this version, so
      # release notes (and anyone checking out the tag) see exactly what was published.
      - name: Tag release
        run: |
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${TAG} (backfill)"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Generate release notes
        run: bun scripts/github-release-notes.ts /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --latest=false \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
