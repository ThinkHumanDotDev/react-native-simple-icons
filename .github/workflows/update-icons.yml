name: Update icons

# Touch to re-register workflow_dispatch / schedule triggers in GitHub Actions.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - name: Save previous manifest
        run: cp src/simple-icons-manifest.json /tmp/simple-icons-manifest.previous.json

      - name: Update simple-icons
        run: bun add --dev --exact simple-icons@latest

      - run: bun run generate:icons

      - name: Classify changes
        run: bun run classify:changes --previous /tmp/simple-icons-manifest.previous.json --current src/simple-icons-manifest.json --markdown .github/update-summary.md --json .github/update-summary.json

      - run: bun run typecheck
      - run: bun run build
      - run: bun run smoke:react-native
      - run: bun run test

      - name: Read processed version
        id: version
        run: echo "version=$(node -p \"require('./src/simple-icons-manifest.json').simpleIconsVersion\")" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-simple-icons
          commit-message: "chore: update simple-icons to v${{ steps.version.outputs.version }}"
          delete-branch: true
          labels: dependencies
          title: "chore: update simple-icons to v${{ steps.version.outputs.version }}"
          body-path: .github/update-summary.md
