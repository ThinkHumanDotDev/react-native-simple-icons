name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are required status checks in .github/rulesets/main.json; rename them together.
# The PR title check lives in pr-title.yml so editing a title does not re-run (or cancel) Validate.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun run generate:icons
      - run: git diff --exit-code
      - run: bun run typecheck
      - run: bun run build
      - run: bun run smoke:react-native
      - run: bun run test
